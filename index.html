<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moje Centrum Aplikacji</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --card-hover: #2c2c2c;
            --accent: #ffb300;
            --text-main: #ffffff;
            --text-muted: #aaa;
        }
        
        body {
            font-family: sans-serif;
            background: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            margin: 0;
            font-size: 24px;
            color: var(--text-main);
            border-bottom: 2px solid var(--accent);
            display: inline-block;
            padding-bottom: 5px;
        }

        /* Siatka kafelków */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
            max-width: 1000px;
            margin: 0 auto;
        }

        /* Pojedynczy kafelek */
        .tile {
            background: var(--card-bg);
            border: 1px solid #333;
            border-radius: 10px;
            padding: 20px;
            text-decoration: none;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 120px;
            transition: transform 0.2s, background 0.2s, border-color 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .tile:hover {
            background: var(--card-hover);
            transform: translateY(-3px);
            border-color: var(--accent);
        }

        .tile-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .tile-desc {
            font-size: 12px;
            color: var(--text-muted);
        }

        .tile-footer {
            font-size: 11px;
            color: var(--accent);
            font-weight: bold;
            align-self: flex-end;
        }
    </style>
</head>
<body>

    <header>
        <h1>Moje Centrum Aplikacji</h1>
    </header>

    <div class="dashboard-grid">
        <!-- Kafelek 1: Arkusz Pracy -->
        <a href="arkusz.html" class="tile">
            <div>
                <div class="tile-title">Arkusz Pracy 2026</div>
                <div class="tile-desc">Rozliczanie godzin, urlopów i finansów.</div>
            </div>
            <div class="tile-footer">Otwórz &rarr;</div>
        </a>

        <!-- Kafelek 2: Druga aplikacja (np. Notes) -->
        <a href="notatnik.html" class="tile">
            <div>
                <div class="tile-title">Szybki Notatnik</div>
                <div class="tile-desc">Twoje codzienne notatki i todo listy.</div>
            </div>
            <div class="tile-footer">Otwórz &rarr;</div>
        </a>

        <!-- Kafelek 3: Wolne miejsce na kolejną apkę -->
        <a href="kalkulator.html" class="tile">
            <div>
                <div class="tile-title">Kalkulator / Finanse</div>
                <div class="tile-desc">Miejsce na kolejny gotowy kod.</div>
            </div>
            <div class="tile-footer">Otwórz &rarr;</div>
        </a>
    </div>

</body>
</html>
